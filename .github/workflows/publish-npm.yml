name: Publish npm package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Check release version
        run: |
          node --check bin/veynod.mjs
          node --check bin/runner.mjs
          test "$(node bin/veynod.mjs --version)" = "$(node -p 'require("./package.json").version')"

      - name: Publish to npm
        run: npm publish --access public
